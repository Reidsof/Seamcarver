<!DOCTYPE html>
<html>
    <head>
        <title>Seamcarver</title>
    </head>
    <body>
        <h1>SEAMCARVER</h1>
        
        <input type="file" id="file" accept="image/*">
        <div>
            <button id="carveOneVertSeam">Remove 1 vertical seam</button>
        </div>
        <div>
            <label for="numberVertSeams">Number of vertical seams to remove:</label>
            <br>
            <input type="number" id="numberVertSeams" name="numberVertSeams" value="1" min="1">
            <button id="vertCarveXTimes">Remove vertical seams</button>
            <br>
        </div>
        <div>
            <button id="carveOneHorizontalSeam">Remove 1 horizontal seam</button>
        </div>
        <div>
            <label for="numberHorizontalSeams">Number of horizontal seams to remove:</label>
            <br>
            <input type="number" id="numberHorizontalSeams" name="numberHorizontalSeams" value="1" min="1">
            <button id="horizontalCarveXTimes">Remove horizontal seams</button>    
        </div>
        <div>
            <br>
            <button id="imgDownload">Download Image</button>
        </div>
        <br>
        <canvas id="canvas"></canvas>
        <script src="script.js"></script>
    </body>
</html>
